<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài học — a0jyng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { primary:'#1E40AF', secondary:'#3B82F6', accent:'#F97316' },
        fontFamily: { logo:['Playfair Display','serif'], sans:['Inter','sans-serif'] }
      }}
    }
  </script>
</head>
<body class="font-sans bg-slate-50 flex h-screen overflow-hidden">
<div id="sidebar-overlay" onclick="closeSidebar()"></div>

<aside id="sidebar" class="w-64 bg-primary text-white flex flex-col fixed md:relative top-0 bottom-0 left-0 z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300">
  <div class="p-5 border-b border-white/10"><a href="index.html" class="font-logo text-2xl font-black">a0<span class="text-accent">jyng</span></a></div>
  <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
    <a href="dashboard.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm"><span>🏠</span> Dashboard</a>
    <a href="subjects.html"  class="sidebar-link active flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm"><span>📚</span> Môn học</a>
    <a href="progress.html"  class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm"><span>📊</span> Tiến trình</a>
    <div class="pt-2 pb-1 px-3 text-xs text-blue-300 uppercase tracking-wider font-semibold">Tiện ích</div>
    <a href="pomodoro.html"  class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm"><span>⏰</span> Pomodoro</a>
    <a href="ai-chat.html"   class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm"><span>🤖</span> AI hỏi đáp</a>
    <a href="forum.html"     class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm"><span>💬</span> Diễn đàn</a>
  </nav>
  <div class="p-4 border-t border-white/10">
    <button id="logoutBtn" class="w-full py-2.5 bg-white/10 hover:bg-red-500/30 rounded-xl text-sm font-medium transition">🚪 Đăng xuất</button>
  </div>
</aside>

<main class="flex-1 flex flex-col overflow-hidden">
  <header class="bg-white shadow-sm px-6 py-4 flex items-center gap-4 flex-shrink-0">
    <button onclick="toggleSidebar()" class="md:hidden p-2 rounded-lg hover:bg-slate-100">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <nav class="text-sm flex items-center gap-1 flex-wrap">
      <a href="subjects.html" class="text-secondary hover:underline">Môn học</a>
      <span class="text-slate-400">›</span>
      <a id="subjectLink" href="chapters.html" class="text-secondary hover:underline">Toán 10</a>
      <span class="text-slate-400">›</span>
      <span id="chapterName" class="font-bold text-slate-800">Chương 1</span>
    </nav>
  </header>

  <div class="flex-1 overflow-y-auto p-6">
    <div id="chapterHero" class="mb-8 p-5 rounded-2xl bg-primary text-white">
      <p class="text-blue-200 text-xs mb-1">Toán 10</p>
      <h1 id="heroTitle" class="text-2xl font-bold">Chương 1: Mệnh đề và tập hợp</h1>
      <p class="text-blue-100 text-sm mt-1">Chọn bài học để bắt đầu</p>
    </div>

    <div class="grid gap-3" id="lessonList">
      <div class="animate-pulse bg-slate-200 rounded-2xl h-20"></div>
      <div class="animate-pulse bg-slate-200 rounded-2xl h-20"></div>
      <div class="animate-pulse bg-slate-200 rounded-2xl h-20"></div>
    </div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
  import { firebaseConfig } from "./assets/js/firebase-config.js";

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  onAuthStateChanged(auth, user => { if (!user) window.location.href = 'login.html'; });
  document.getElementById('logoutBtn').addEventListener('click', async () => { await signOut(auth); window.location.href = 'index.html'; });

  const params    = new URLSearchParams(window.location.search);
  const chapterId = params.get('chapter') || 'toan-10-c1';

  const LESSONS = {
    'toan-10-c1': {
      chapterName:'Chương 1: Mệnh đề và tập hợp',
      subjectId:'toan-10', subjectName:'Toán 10',
      lessons:[
        { id:'toan-10-c1-b1', name:'Bài 1: Mệnh đề',                      activities:3, status:'in-progress', progress:40 },
        { id:'toan-10-c1-b2', name:'Bài 2: Tập hợp và các phép toán',     activities:4, status:'locked',      progress:0  },
        { id:'toan-10-c1-b3', name:'Bài 3: Các phép toán tập hợp',        activities:3, status:'locked',      progress:0  },
      ]
    },
    'ly-10-c1': {
      chapterName:'Chương 1: Động học chất điểm',
      subjectId:'ly-10', subjectName:'Vật Lý 10',
      lessons:[
        { id:'ly-10-c1-b1', name:'Bài 1: Chuyển động thẳng đều',          activities:3, status:'not-started', progress:0 },
        { id:'ly-10-c1-b2', name:'Bài 2: Chuyển động thẳng biến đổi đều', activities:4, status:'locked',      progress:0 },
        { id:'ly-10-c1-b3', name:'Bài 3: Rơi tự do',                      activities:3, status:'locked',      progress:0 },
        { id:'ly-10-c1-b4', name:'Bài 4: Chuyển động tròn đều',           activities:3, status:'locked',      progress:0 },
      ]
    },
  };

  const data = LESSONS[chapterId] || LESSONS['toan-10-c1'];
  document.getElementById('chapterName').textContent = data.chapterName;
  document.getElementById('heroTitle').textContent   = data.chapterName;
  document.getElementById('subjectLink').textContent = data.subjectName;
  document.getElementById('subjectLink').href        = `chapters.html?subject=${data.subjectId}`;

  const statusIcon = { 'completed':'✅', 'in-progress':'📖', 'not-started':'⭕', 'locked':'🔒' };
  const statusColor= { 'completed':'text-green-600', 'in-progress':'text-secondary', 'not-started':'text-slate-500', 'locked':'text-slate-400' };

  document.getElementById('lessonList').innerHTML = data.lessons.map((l, i) => {
    const locked = l.status === 'locked';
    return `
    <a href="${locked ? '#' : 'lesson-detail.html?id=' + l.id}"
       class="flex items-center gap-4 bg-white rounded-2xl shadow-sm border border-slate-100 p-5 ${locked ? 'opacity-60 cursor-not-allowed' : 'card-hover hover:border-secondary'} transition group">
      <div class="w-12 h-12 rounded-xl ${locked ? 'bg-slate-100' : 'bg-blue-100'} flex items-center justify-center font-black text-primary text-lg flex-shrink-0">
        ${i+1}
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
          <h3 class="font-semibold text-slate-800 text-sm">${l.name}</h3>
          <span class="text-sm ${statusColor[l.status]}">${statusIcon[l.status]}</span>
        </div>
        <p class="text-xs text-slate-500 mt-0.5">${l.activities} hoạt động</p>
        <div class="progress-bar mt-2 w-full">
          <div class="progress-fill" style="width:${l.progress}%"></div>
        </div>
      </div>
      ${!locked ? `<span class="px-3 py-1.5 bg-accent text-white text-xs font-bold rounded-lg opacity-0 group-hover:opacity-100 transition">Học →</span>` : ''}
    </a>`;
  }).join('');

  window.toggleSidebar = () => { document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('sidebar-overlay').classList.toggle('active'); };
  window.closeSidebar  = () => { document.getElementById('sidebar').classList.add('-translate-x-full'); document.getElementById('sidebar-overlay').classList.remove('active'); };
</script>
</body>
</html>
