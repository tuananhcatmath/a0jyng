<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Môn học — a0jyng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { primary:'#1E40AF', secondary:'#3B82F6', accent:'#F97316' },
        fontFamily: { logo:['Playfair Display','serif'], sans:['Inter','sans-serif'] }
      }}
    }
  </script>
</head>
<body class="font-sans bg-slate-50 flex h-screen overflow-hidden">
<div id="sidebar-overlay" onclick="closeSidebar()"></div>

<!-- SIDEBAR (reusable) -->
<aside id="sidebar" class="w-64 bg-primary text-white flex flex-col fixed md:relative top-0 bottom-0 left-0 z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300">
  <div class="p-5 border-b border-white/10">
    <a href="index.html" class="font-logo text-2xl font-black">a0<span class="text-accent">jyng</span></a>
  </div>
  <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
    <a href="dashboard.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>🏠</span> Dashboard</a>
    <a href="ai-studio.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>✨</span> AI Studio Học tập</a>
    <a href="subjects.html"  class="sidebar-link active flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>📚</span> Môn học</a>
    <a href="progress.html"  class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>📊</span> Tiến trình</a>
    <div class="pt-2 pb-1 px-3 text-xs text-blue-300 uppercase tracking-wider font-semibold">Tiện ích</div>
    <a href="schedule.html"  class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>🗓️</span> Lịch học</a>
    <a href="roadmap.html"   class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>🧭</span> Lộ trình</a>
    <a href="pomodoro.html"  class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>⏰</span> Pomodoro</a>
    <a href="ai-chat.html"   class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>🤖</span> AI hỏi đáp</a>
    <a href="forum.html"     class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>💬</span> Diễn đàn</a>
    <a href="textbook.html"  class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>📗</span> Giải SGK</a>
    <a href="theorems.html"  class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>🧮</span> Định lý</a>
    <a href="summaries.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>📝</span> Tóm tắt</a>
    <a href="reports.html"   class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>📈</span> Báo cáo</a>
  </nav>
  <div class="p-4 border-t border-white/10">
    <button id="logoutBtn" class="w-full py-2.5 bg-white/10 hover:bg-red-500/30 rounded-xl text-sm font-medium transition">🚪 Đăng xuất</button>
  </div>
</aside>

<main class="flex-1 flex flex-col overflow-hidden">
  <header class="bg-white shadow-sm px-6 py-4 flex items-center gap-4 flex-shrink-0">
    <button onclick="toggleSidebar()" class="md:hidden p-2 rounded-lg hover:bg-slate-100">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <!-- Grade selector -->
    <div class="flex items-center gap-3 flex-wrap flex-1">
      <h1 class="text-xl font-bold text-slate-800">📚 Chọn môn học</h1>
      <div class="flex gap-2">
        <button data-grade="10" class="grade-btn px-3 py-1 rounded-full text-sm font-semibold bg-primary text-white">Lớp 10</button>
        <button data-grade="11" class="grade-btn px-3 py-1 rounded-full text-sm font-semibold bg-slate-200 text-slate-600 hover:bg-slate-300">Lớp 11</button>
        <button data-grade="12" class="grade-btn px-3 py-1 rounded-full text-sm font-semibold bg-slate-200 text-slate-600 hover:bg-slate-300">Lớp 12</button>
      </div>
    </div>
    <div class="relative">
      <button id="notificationBellBtn" class="relative p-2 rounded-full hover:bg-slate-100 transition focus:outline-none focus:ring-2 focus:ring-primary/20" title="Thông báo hệ thống">
        <span class="text-xl">🔔</span>
        <span class="notification-dot-indicator absolute top-1 right-1 w-2.5 h-2.5 bg-accent rounded-full ring-2 ring-white animate-pulse"></span>
      </button>
    </div>
  </header>

  <div class="flex-1 overflow-y-auto p-6">
    <!-- Search -->
    <div class="mb-6 relative">
      <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">🔍</span>
      <input type="text" id="searchInput" placeholder="Tìm môn học..." class="w-full pl-10 pr-4 py-3 border-2 border-slate-200 rounded-xl focus:ring-2 focus:ring-secondary focus:border-secondary outline-none text-sm">
    </div>

    <div id="subjectGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      <!-- Populated by JS -->
    </div>
  </div>
</main>

<script type="module">
  import { getCurrentUser, signOut as dbSignOut } from "./assets/js/db.js";

  const user = await getCurrentUser();
  if (!user) {
    localStorage.setItem('a0jyng_session', JSON.stringify({ id: 'guest', name: 'Học sinh', email: 'guest@a0jyng.vn', grade: 10 }));
  }
  document.getElementById('logoutBtn').addEventListener('click', async () => { await dbSignOut(); window.location.href = 'index.html'; });

  // Subject data — loaded from Firestore or fallback
  const FALLBACK_SUBJECTS = {
    10: [
      { id:'toan-10', name:'Toán 10',       icon:'📐', color:'#3B82F6', chaptersCount:3 },
      { id:'ly-10',   name:'Vật Lý 10',     icon:'⚛️', color:'#F97316', chaptersCount:2 },
      { id:'hoa-10',  name:'Hóa Học 10',    icon:'🧪', color:'#10B981', chaptersCount:2 },
      { id:'van-10',  name:'Ngữ Văn 10',    icon:'📖', color:'#8B5CF6', chaptersCount:2 },
      { id:'anh-10',  name:'Tiếng Anh 10',  icon:'🌍', color:'#EC4899', chaptersCount:2 },
      { id:'su-10',   name:'Lịch Sử 10',    icon:'🏛️', color:'#6366F1', chaptersCount:2 },
      { id:'dia-10',  name:'Địa Lý 10',     icon:'🗺️', color:'#14B8A6', chaptersCount:2 },
      { id:'tin-10',  name:'Tin Học 10',    icon:'💻', color:'#F59E0B', chaptersCount:2 },
    ],
    11: [
      { id:'toan-11', name:'Toán 11',       icon:'📐', color:'#3B82F6', chaptersCount:4 },
      { id:'ly-11',   name:'Vật Lý 11',     icon:'⚛️', color:'#F97316', chaptersCount:3 },
    ],
    12: [
      { id:'toan-12', name:'Toán 12',       icon:'📐', color:'#3B82F6', chaptersCount:4 },
      { id:'ly-12',   name:'Vật Lý 12',     icon:'⚛️', color:'#F97316', chaptersCount:3 },
    ],
  };

  let currentGrade = 10;
  let allSubjects  = FALLBACK_SUBJECTS[10];

  function renderSubjects(list) {
    document.getElementById('subjectGrid').innerHTML = list.length
      ? list.map(s => `
        <a href="chapters.html?subject=${s.id}" class="card-hover group bg-white rounded-2xl shadow-sm border border-slate-100 p-5 flex flex-col items-center text-center hover:shadow-md transition">
          <div class="w-16 h-16 rounded-2xl flex items-center justify-center text-4xl mb-3" style="background:${s.color}18">
            ${s.icon}
          </div>
          <h3 class="font-bold text-slate-800 text-sm">${s.name}</h3>
          <p class="text-xs text-slate-400 mt-1">${s.chaptersCount} chương</p>
          <div class="mt-3 progress-bar w-full">
            <div class="progress-fill" style="width:${Math.floor(Math.random()*60)}%"></div>
          </div>
          <span class="mt-3 text-xs font-semibold text-secondary opacity-0 group-hover:opacity-100 transition">Vào học →</span>
        </a>`)
        .join('')
      : '<p class="text-slate-400 col-span-4 py-12 text-center">Không tìm thấy môn học</p>';
  }

  // Grade buttons
  document.querySelectorAll('.grade-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.grade-btn').forEach(b => {
        b.className = 'grade-btn px-3 py-1 rounded-full text-sm font-semibold bg-slate-200 text-slate-600 hover:bg-slate-300';
      });
      btn.className = 'grade-btn px-3 py-1 rounded-full text-sm font-semibold bg-primary text-white';
      currentGrade = parseInt(btn.dataset.grade);
      allSubjects  = FALLBACK_SUBJECTS[currentGrade] || [];
      renderSubjects(allSubjects);
    });
  });

  // Search
  document.getElementById('searchInput').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    renderSubjects(allSubjects.filter(s => s.name.toLowerCase().includes(q)));
  });

  renderSubjects(allSubjects);

  window.toggleSidebar = () => {
    document.getElementById('sidebar').classList.toggle('-translate-x-full');
    document.getElementById('sidebar-overlay').classList.toggle('active');
  };
  window.closeSidebar = () => {
    document.getElementById('sidebar').classList.add('-translate-x-full');
    document.getElementById('sidebar-overlay').classList.remove('active');
  };
</script>
<script type="module">
  import { initNotificationCenter } from './assets/js/notifications.js';
  initNotificationCenter({ bellButtonId: 'notificationBellBtn' });
</script>
</body>
</html>
