<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu — a0jyng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { primary:'#1E40AF', secondary:'#3B82F6', accent:'#F97316' },
        fontFamily: { logo:['Playfair Display','serif'], sans:['Inter','sans-serif'] }
      }}
    }
  </script>
</head>
<body class="font-sans min-h-screen bg-slate-50 flex items-center justify-center p-6">
<div class="w-full max-w-md">
  <div class="text-center mb-8">
    <a href="index.html" class="font-logo text-4xl font-black text-primary">
      a0<span class="text-accent">jyng</span>
    </a>
  </div>

  <!-- Step 1: Enter email -->
  <div id="step1" class="bg-white rounded-3xl shadow-xl p-8 animate-fade-in">
    <div class="text-center mb-6">
      <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">🔐</div>
      <h1 class="text-2xl font-bold text-slate-800">Quên mật khẩu?</h1>
      <p class="text-slate-500 text-sm mt-1">Nhập email để nhận link đặt lại mật khẩu</p>
    </div>

    <div id="errorBox" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-xl">
      <p id="errorMsg" class="text-red-600 text-sm"></p>
    </div>

    <form id="resetForm" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Email đã đăng ký</label>
        <input type="email" id="email" placeholder="ten@example.com" required
          class="w-full px-4 py-3 border-2 border-slate-200 rounded-xl focus:ring-2 focus:ring-secondary focus:border-secondary outline-none text-sm">
      </div>
      <button type="submit" id="submitBtn"
        class="w-full py-3 bg-accent text-white rounded-xl font-bold hover:bg-orange-600 transition shadow-lg shadow-orange-200">
        Gửi link đặt lại mật khẩu
      </button>
    </form>

    <div class="text-center mt-5">
      <a href="login.html" class="text-secondary text-sm hover:underline">← Quay lại đăng nhập</a>
    </div>
  </div>

  <!-- Step 2: Success -->
  <div id="step2" class="hidden bg-white rounded-3xl shadow-xl p-8 text-center animate-fade-in">
    <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center text-4xl mx-auto mb-5">📬</div>
    <h2 class="text-2xl font-bold text-slate-800 mb-2">Email đã được gửi!</h2>
    <p class="text-slate-600 mb-1">Link đặt lại mật khẩu đã gửi đến:</p>
    <p id="sentEmail" class="font-bold text-primary mb-5"></p>
    <p class="text-slate-500 text-sm mb-6">Kiểm tra hộp thư đến (và thư mục Spam) của bạn. Link có hiệu lực trong 15 phút.</p>
    <a href="login.html" class="inline-block px-6 py-3 bg-primary text-white rounded-xl font-semibold hover:bg-blue-800 transition">
      Quay lại đăng nhập
    </a>
    <div class="mt-4">
      <button id="resendBtn" class="text-sm text-secondary hover:underline">Gửi lại email</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
  import { firebaseConfig } from "./assets/js/firebase-config.js";

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const btn   = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Đang gửi...';

    try {
      await sendPasswordResetEmail(auth, email);
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');
      document.getElementById('sentEmail').textContent = email;
    } catch (err) {
      const msgs = {
        'auth/user-not-found': 'Email này chưa được đăng ký.',
        'auth/invalid-email':  'Email không hợp lệ.',
        'auth/too-many-requests': 'Quá nhiều yêu cầu. Vui lòng thử lại sau.',
      };
      document.getElementById('errorMsg').textContent = msgs[err.code] || 'Có lỗi xảy ra. Vui lòng thử lại.';
      document.getElementById('errorBox').classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'Gửi link đặt lại mật khẩu';
    }
  });

  document.getElementById('resendBtn')?.addEventListener('click', () => {
    document.getElementById('step2').classList.add('hidden');
    document.getElementById('step1').classList.remove('hidden');
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('submitBtn').textContent = 'Gửi link đặt lại mật khẩu';
  });
</script>
</body>
</html>
