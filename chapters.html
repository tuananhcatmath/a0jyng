<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chương — a0jyng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { primary:'#1E40AF', secondary:'#3B82F6', accent:'#F97316' },
        fontFamily: { logo:['Playfair Display','serif'], sans:['Inter','sans-serif'] }
      }}
    }
  </script>
</head>
<body class="font-sans bg-slate-50 flex h-screen overflow-hidden">
<div id="sidebar-overlay" onclick="closeSidebar()"></div>

<aside id="sidebar" class="w-64 bg-primary text-white flex flex-col fixed md:relative top-0 bottom-0 left-0 z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300">
  <div class="p-5 border-b border-white/10"><a href="index.html" class="font-logo text-2xl font-black">a0<span class="text-accent">jyng</span></a></div>
  <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
    <a href="dashboard.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>🏠</span> Dashboard</a>
    <a href="subjects.html"  class="sidebar-link active flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>📚</span> Môn học</a>
    <a href="progress.html"  class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>📊</span> Tiến trình</a>
    <div class="pt-2 pb-1 px-3 text-xs text-blue-300 uppercase tracking-wider font-semibold">Tiện ích</div>
    <a href="exercises.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>📝</span> Bài tập & Đề thi</a>
    <a href="schedule.html"  class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>🗓️</span> Lịch học</a>
    <a href="roadmap.html"   class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>🧭</span> Lộ trình</a>
    <a href="pomodoro.html"  class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>⏰</span> Pomodoro</a>
    <a href="ai-chat.html"   class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>🤖</span> AI hỏi đáp</a>
    <a href="forum.html"     class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>💬</span> Diễn đàn</a>
    <a href="textbook.html"  class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>📗</span> Giải SGK</a>
    <a href="theorems.html"  class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>🧮</span> Định lý</a>
    <a href="summaries.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>📝</span> Tóm tắt</a>
    <a href="reports.html"   class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>📈</span> Báo cáo</a>
  </nav>
  <div class="p-4 border-t border-white/10">
    <button id="logoutBtn" class="w-full py-2.5 bg-white/10 hover:bg-red-500/30 rounded-xl text-sm font-medium transition">🚪 Đăng xuất</button>
  </div>
</aside>

<main class="flex-1 flex flex-col overflow-hidden">
  <header class="bg-white shadow-sm px-6 py-4 flex items-center gap-4 flex-shrink-0">
    <button onclick="toggleSidebar()" class="md:hidden p-2 rounded-lg hover:bg-slate-100">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <!-- Breadcrumb -->
    <nav class="text-sm flex items-center gap-1 flex-wrap">
      <a href="subjects.html" class="text-secondary hover:underline">Môn học</a>
      <span class="text-slate-400">›</span>
      <span id="subjectName" class="font-bold text-slate-800">...</span>
    </nav>
  </header>

  <div class="flex-1 overflow-y-auto p-6">
    <!-- Subject hero -->
    <div id="subjectHero" class="mb-8 p-6 rounded-2xl bg-gradient-to-r from-primary to-secondary text-white flex items-center gap-5">
      <div class="text-6xl" id="heroIcon">📐</div>
      <div>
        <p class="text-blue-200 text-sm mb-1">Chọn chương để bắt đầu học</p>
        <h1 id="heroTitle" class="text-3xl font-bold">Toán 10</h1>
        <p id="heroMeta" class="text-blue-100 text-sm mt-1">3 chương • 9 bài học • 27 hoạt động</p>
      </div>
    </div>

    <!-- Chapters grid -->
    <h2 class="text-xl font-bold text-slate-800 mb-4">📑 Danh sách chương</h2>
    <div id="chapterList" class="grid md:grid-cols-2 gap-4">
      <!-- Skeleton -->
      <div class="animate-pulse bg-slate-200 rounded-2xl h-24"></div>
      <div class="animate-pulse bg-slate-200 rounded-2xl h-24"></div>
      <div class="animate-pulse bg-slate-200 rounded-2xl h-24"></div>
    </div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
  import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
  import { firebaseConfig } from "./assets/js/firebase-config.js";

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  onAuthStateChanged(auth, user => { if (!user) window.location.href = 'login.html'; });
  document.getElementById('logoutBtn').addEventListener('click', async () => { await signOut(auth); window.location.href = 'index.html'; });

  const params    = new URLSearchParams(window.location.search);
  const subjectId = params.get('subject') || 'toan-10';

  // Fallback chapter data (used if Firestore not configured)
  const CHAPTERS = {
    'toan-10': {
      name:'Toán 10', icon:'📐', color:'#3B82F6',
      chapters:[
        { id:'toan-10-c1', name:'Chương 1: Mệnh đề và tập hợp',            lessons:3, desc:'Mệnh đề, tập hợp, các phép toán' },
        { id:'toan-10-c2', name:'Chương 2: Bất phương trình bậc nhất',      lessons:3, desc:'Giải BPT, hệ BPT, ứng dụng' },
        { id:'toan-10-c3', name:'Chương 3: Hệ thức lượng trong tam giác',   lessons:3, desc:'Định lý cos, sin, diện tích' },
      ]
    },
    'ly-10': {
      name:'Vật Lý 10', icon:'⚛️', color:'#F97316',
      chapters:[
        { id:'ly-10-c1', name:'Chương 1: Động học chất điểm',    lessons:4, desc:'Chuyển động, vận tốc, gia tốc' },
        { id:'ly-10-c2', name:'Chương 2: Động lực học chất điểm',lessons:3, desc:'Các định luật Newton, lực ma sát' },
      ]
    },
    'hoa-10': {
      name:'Hóa Học 10', icon:'🧪', color:'#10B981',
      chapters:[
        { id:'hoa-10-c1', name:'Chương 1: Nguyên tử',            lessons:3, desc:'Cấu tạo nguyên tử, số hiệu' },
        { id:'hoa-10-c2', name:'Chương 2: Bảng tuần hoàn',       lessons:3, desc:'Chu kỳ, nhóm, tính chất' },
      ]
    },
    'van-10': {
      name:'Ngữ Văn 10', icon:'📖', color:'#8B5CF6',
      chapters:[
        { id:'van-10-c1', name:'Chương 1: Văn học dân gian',     lessons:4, desc:'Sử thi, ca dao, tục ngữ' },
        { id:'van-10-c2', name:'Chương 2: Văn học trung đại',    lessons:3, desc:'Thơ Đường, Nôm, truyện' },
      ]
    },
  };

  const data = CHAPTERS[subjectId] || CHAPTERS['toan-10'];
  document.getElementById('subjectName').textContent = data.name;
  document.getElementById('heroIcon').textContent    = data.icon;
  document.getElementById('heroTitle').textContent   = data.name;
  document.getElementById('heroMeta').textContent    = `${data.chapters.length} chương • ${data.chapters.reduce((a,c)=>a+c.lessons,0)} bài học`;
  document.getElementById('subjectHero').style.background = `linear-gradient(135deg, #1E40AF, ${data.color})`;

  // Calculate real lesson progress from localStorage
  const _lsProgress = JSON.parse(localStorage.getItem('a0jyng_progress') || '{}');
  function getChapterProgress(chapterId) {
    // Count unique lesson IDs that start with chapterId prefix
    const done = new Set();
    Object.keys(_lsProgress).forEach(k => {
      const lessonId = k.split('_')[0]; // e.g. "toan-10-c1-b1"
      if (lessonId.startsWith(chapterId)) done.add(lessonId);
    });
    return done.size;
  }

  document.getElementById('chapterList').innerHTML = data.chapters.map((c, i) => {
    const doneLessons = getChapterProgress(c.id);
    const pct = c.lessons > 0 ? Math.round((doneLessons / c.lessons) * 100) : 0;
    return `
    <a href="lessons.html?chapter=${c.id}" class="card-hover group flex items-center gap-4 bg-white rounded-2xl shadow-sm border border-slate-100 p-5 hover:border-secondary transition">
      <div class="w-14 h-14 rounded-2xl bg-blue-100 flex items-center justify-center text-2xl font-black text-primary flex-shrink-0">
        ${i+1}
      </div>
      <div class="flex-1 min-w-0">
        <h3 class="font-bold text-slate-800 text-sm">${c.name}</h3>
        <p class="text-xs text-slate-500 mt-0.5">${c.desc}</p>
        <div class="flex items-center gap-3 mt-2">
          <span class="text-xs text-slate-400">📄 ${c.lessons} bài</span>
          <div class="flex-1 progress-bar">
            <div class="progress-fill" style="width:${pct}%"></div>
          </div>
          <span class="text-xs font-semibold ${pct > 0 ? 'text-primary' : 'text-slate-400'}">${pct}%</span>
        </div>
      </div>
      <span class="text-secondary opacity-0 group-hover:opacity-100 transition font-bold">→</span>
    </a>`;
  }).join('');

  window.toggleSidebar = () => { document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('sidebar-overlay').classList.toggle('active'); };
  window.closeSidebar  = () => { document.getElementById('sidebar').classList.add('-translate-x-full'); document.getElementById('sidebar-overlay').classList.remove('active'); };
</script>
</body>
</html>
