<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diễn đàn — a0jyng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { primary:'#1E40AF', secondary:'#3B82F6', accent:'#F97316' },
        fontFamily: { logo:['Playfair Display','serif'], sans:['Inter','sans-serif'] }
      }}
    }
  </script>
</head>
<body class="font-sans bg-slate-50 flex h-screen overflow-hidden">
<div id="sidebar-overlay" onclick="closeSidebar()"></div>

<aside id="sidebar" class="w-64 bg-primary text-white flex flex-col fixed md:relative top-0 bottom-0 left-0 z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300">
  <div class="p-5 border-b border-white/10"><a href="index.html" class="font-logo text-2xl font-black">a0<span class="text-accent">jyng</span></a></div>
  <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
    <a href="dashboard.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm"><span>🏠</span> Dashboard</a>
    <a href="ai-studio.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm font-medium"><span>✨</span> AI Studio Học tập</a>
    <a href="subjects.html"  class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm"><span>📚</span> Môn học</a>
    <a href="forum.html"     class="sidebar-link active flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm"><span>💬</span> Diễn đàn</a>
    <a href="ai-chat.html"   class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm"><span>🤖</span> AI hỏi đáp</a>
    <a href="pomodoro.html"  class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 transition text-sm"><span>⏰</span> Pomodoro</a>
  </nav>
  <div class="p-4 border-t border-white/10">
    <button id="logoutBtn" class="w-full py-2.5 bg-white/10 hover:bg-red-500/30 rounded-xl text-sm font-medium transition">🚪 Đăng xuất</button>
  </div>
</aside>

<main class="flex-1 flex flex-col overflow-hidden">
  <header class="bg-white shadow-sm px-6 py-4 flex items-center justify-between flex-shrink-0">
    <div class="flex items-center gap-4">
      <button onclick="toggleSidebar()" class="md:hidden p-2 rounded-lg hover:bg-slate-100">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1 class="text-xl font-bold text-slate-800">💬 Diễn đàn</h1>
    </div>
    <button id="newPostBtn" class="px-4 py-2 bg-accent text-white text-sm font-semibold rounded-lg hover:bg-orange-600 transition">
      ✏️ Đặt câu hỏi mới
    </button>
  </header>

  <div class="flex-1 overflow-y-auto p-6">
    <div class="max-w-3xl mx-auto">

      <!-- Filter tabs -->
      <div class="flex gap-2 mb-6 flex-wrap">
        <button class="forum-tab px-4 py-2 rounded-full text-sm font-semibold bg-primary text-white" data-tab="all">🌐 Tất cả</button>
        <button class="forum-tab px-4 py-2 rounded-full text-sm font-semibold bg-slate-200 text-slate-600 hover:bg-slate-300" data-tab="toan">📐 Toán</button>
        <button class="forum-tab px-4 py-2 rounded-full text-sm font-semibold bg-slate-200 text-slate-600 hover:bg-slate-300" data-tab="ly">⚛️ Vật lý</button>
        <button class="forum-tab px-4 py-2 rounded-full text-sm font-semibold bg-slate-200 text-slate-600 hover:bg-slate-300" data-tab="hoa">🧪 Hóa học</button>
        <button class="forum-tab px-4 py-2 rounded-full text-sm font-semibold bg-slate-200 text-slate-600 hover:bg-slate-300" data-tab="unanswered">❓ Chưa trả lời</button>
      </div>

      <!-- Search -->
      <div class="mb-5 relative">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">🔍</span>
        <input type="text" id="forumSearch" placeholder="Tìm câu hỏi..." class="w-full pl-10 pr-4 py-3 border-2 border-slate-200 rounded-xl focus:ring-2 focus:ring-secondary outline-none text-sm">
      </div>

      <!-- Post list -->
      <div id="postList" class="space-y-3">
        <!-- Populated by JS -->
      </div>

    </div>
  </div>
</main>

<!-- New post modal -->
<div id="newPostModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/50" onclick="closeModal()"></div>
  <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6 animate-fade-in">
    <h2 class="text-xl font-bold text-slate-800 mb-4">✏️ Đặt câu hỏi mới</h2>
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Tiêu đề câu hỏi <span class="text-red-400">*</span></label>
        <input type="text" id="postTitle" placeholder="VD: Làm thế nào để giải phương trình bậc 2?" class="w-full px-4 py-3 border-2 border-slate-200 rounded-xl focus:ring-2 focus:ring-secondary outline-none text-sm">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Môn học</label>
        <select id="postSubject" class="w-full px-4 py-3 border-2 border-slate-200 rounded-xl focus:ring-2 focus:ring-secondary outline-none text-sm bg-white">
          <option value="toan">📐 Toán học</option>
          <option value="ly">⚛️ Vật lý</option>
          <option value="hoa">🧪 Hóa học</option>
          <option value="van">📖 Ngữ văn</option>
          <option value="anh">🌍 Tiếng Anh</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Nội dung <span class="text-red-400">*</span></label>
        <textarea id="postContent" rows="4" placeholder="Mô tả chi tiết câu hỏi của bạn..." class="w-full px-4 py-3 border-2 border-slate-200 rounded-xl focus:ring-2 focus:ring-secondary outline-none text-sm resize-none"></textarea>
      </div>
    </div>
    <div class="flex gap-3 mt-5">
      <button onclick="closeModal()" class="flex-1 py-3 bg-slate-100 rounded-xl font-semibold hover:bg-slate-200 transition">Huỷ</button>
      <button id="submitPost" class="flex-1 py-3 bg-accent text-white rounded-xl font-bold hover:bg-orange-600 transition">🚀 Đăng câu hỏi</button>
    </div>
  </div>
</div>

<script type="module">
  import { getCurrentUser, signOut as dbSignOut } from "./assets/js/db.js";

  let currentUser = await getCurrentUser();
  if (!currentUser) {
    currentUser = { name: "Học viên", email: "guest@a0jyng.edu.vn", role: "student" };
    localStorage.setItem('a0jyng_session', JSON.stringify(currentUser));
  }
  document.getElementById('logoutBtn')?.addEventListener('click', async () => {
    await dbSignOut();
    localStorage.removeItem('a0jyng_session');
    window.location.href = 'login.html';
  });
  loadPosts();

  const SUBJECT_ICONS = { toan:'📐', ly:'⚛️', hoa:'🧪', van:'📖', anh:'🌍' };
  const SUBJECT_LABELS= { toan:'Toán', ly:'Vật lý', hoa:'Hóa học', van:'Ngữ văn', anh:'Tiếng Anh' };

  // Fallback static posts (shown if Firestore not configured)
  const DEMO_POSTS = [
    { id:'1', title:'Làm sao giải bài toán mệnh đề phủ định?', subject:'toan', content:'Em không hiểu cách viết phủ định của mệnh đề "Mọi số nguyên tố đều lẻ". Bạn nào giải thích giúp em với!', author:'Nguyễn Văn A', authorInitial:'A', answers:3, likes:12, timeAgo:'2 giờ trước' },
    { id:'2', title:'Công thức vận tốc trong chuyển động thẳng đều', subject:'ly', content:'Cho mình hỏi x = x₀ + vt và s = vt khác nhau ở điểm nào? Khi nào dùng cái nào?', author:'Trần Thị B', authorInitial:'B', answers:5, likes:8, timeAgo:'5 giờ trước' },
    { id:'3', title:'Nguyên tử khối của các nguyên tố thường gặp', subject:'hoa', content:'Mình hay nhầm khối lượng nguyên tử của C, N, O, Na, Fe... Có cách nào nhớ nhanh không?', author:'Lê Minh C', authorInitial:'C', answers:7, likes:20, timeAgo:'1 ngày trước' },
    { id:'4', title:'Phân tích nhân vật Thúy Kiều trong đoạn trích "Trao duyên"', subject:'van', content:'Trong đoạn trích Trao duyên, Thúy Kiều được khắc họa như thế nào? Cần phân tích chi tiết cho bài văn lớp 10.', author:'Phạm Lan D', authorInitial:'D', answers:2, likes:5, timeAgo:'2 ngày trước' },
    { id:'5', title:'Cách dùng Present Perfect vs Simple Past', subject:'anh', content:'Em cứ nhầm giữa hai thì này. Khi nào dùng Present Perfect, khi nào dùng Simple Past?', author:'Hoàng Nam E', authorInitial:'E', answers:0, likes:3, timeAgo:'3 ngày trước' },
  ];

  let allPosts = DEMO_POSTS;
  let currentFilter = 'all';

  function renderPosts(posts) {
    const filtered = currentFilter === 'all' ? posts
      : currentFilter === 'unanswered' ? posts.filter(p => (p.answers || 0) === 0)
      : posts.filter(p => p.subject === currentFilter);

    document.getElementById('postList').innerHTML = filtered.length
      ? filtered.map(p => `
        <div class="card-hover bg-white rounded-2xl shadow-sm border border-slate-100 p-5 cursor-pointer">
          <div class="flex items-start gap-4">
            <div class="w-10 h-10 rounded-full bg-primary text-white flex items-center justify-center font-bold flex-shrink-0">
              ${p.authorInitial || p.author?.[0] || '?'}
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-start justify-between gap-2">
                <h3 class="font-semibold text-slate-800 text-sm hover:text-primary transition">${p.title}</h3>
                <span class="flex-shrink-0 px-2 py-0.5 bg-slate-100 text-slate-600 text-xs rounded-full">${SUBJECT_ICONS[p.subject] || '📚'} ${SUBJECT_LABELS[p.subject] || p.subject}</span>
              </div>
              <p class="text-slate-500 text-xs mt-1 line-clamp-2">${p.content}</p>
              <div class="flex items-center gap-4 mt-3 text-xs text-slate-400">
                <span>👤 ${p.author}</span>
                <span>🕐 ${p.timeAgo || 'vừa xong'}</span>
                <span class="${p.answers > 0 ? 'text-green-500' : 'text-slate-400'}">💬 ${p.answers || 0} trả lời</span>
                <span>❤️ ${p.likes || 0}</span>
              </div>
            </div>
          </div>
        </div>`)
        .join('')
      : '<p class="text-slate-400 py-10 text-center">Không có câu hỏi nào</p>';
  }

  function loadPosts() {
    // Try Firestore real-time
    try {
      const q = query(collection(db, 'forumPosts'), orderBy('createdAt', 'desc'));
      onSnapshot(q, (snap) => {
        if (!snap.empty) {
          allPosts = snap.docs.map(d => ({
            id: d.id,
            ...d.data(),
            authorInitial: d.data().author?.[0]?.toUpperCase() || '?',
            timeAgo: timeAgo(d.data().createdAt?.toDate?.()),
          }));
          renderPosts(allPosts);
        } else {
          renderPosts(allPosts); // Use demo data
        }
      });
    } catch(e) {
      renderPosts(allPosts); // Use demo data
    }
  }

  function timeAgo(date) {
    if (!date) return 'vừa xong';
    const diff = (Date.now() - date.getTime()) / 1000;
    if (diff < 60) return 'vừa xong';
    if (diff < 3600) return `${Math.floor(diff/60)} phút trước`;
    if (diff < 86400) return `${Math.floor(diff/3600)} giờ trước`;
    return `${Math.floor(diff/86400)} ngày trước`;
  }

  // Filter tabs
  document.querySelectorAll('.forum-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.forum-tab').forEach(b => {
        b.className = 'forum-tab px-4 py-2 rounded-full text-sm font-semibold bg-slate-200 text-slate-600 hover:bg-slate-300';
      });
      btn.className = 'forum-tab px-4 py-2 rounded-full text-sm font-semibold bg-primary text-white';
      currentFilter = btn.dataset.tab;
      renderPosts(allPosts);
    });
  });

  // Search
  document.getElementById('forumSearch').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    renderPosts(allPosts.filter(p => p.title.toLowerCase().includes(q) || p.content.toLowerCase().includes(q)));
  });

  // Modal
  document.getElementById('newPostBtn').addEventListener('click', () => {
    document.getElementById('newPostModal').classList.remove('hidden');
  });
  window.closeModal = () => document.getElementById('newPostModal').classList.add('hidden');

  document.getElementById('submitPost').addEventListener('click', async () => {
    const title   = document.getElementById('postTitle').value.trim();
    const content = document.getElementById('postContent').value.trim();
    const subject = document.getElementById('postSubject').value;

    if (!title || !content) { alert('Vui lòng điền tiêu đề và nội dung!'); return; }

    const btn = document.getElementById('submitPost');
    btn.disabled = true; btn.textContent = 'Đang đăng...';

    const newPost = {
      title, content, subject,
      author: currentUser?.displayName || currentUser?.email?.split('@')[0] || 'Ẩn danh',
      authorId: currentUser?.uid,
      answers: 0, likes: 0,
      createdAt: serverTimestamp(),
    };

    try {
      await addDoc(collection(db, 'forumPosts'), newPost);
    } catch(e) {
      // Add to local demo list
      allPosts.unshift({ ...newPost, id: Date.now().toString(), authorInitial: newPost.author[0], timeAgo: 'vừa xong', createdAt: null });
      renderPosts(allPosts);
    }

    closeModal();
    document.getElementById('postTitle').value = '';
    document.getElementById('postContent').value = '';
    btn.disabled = false; btn.textContent = '🚀 Đăng câu hỏi';
  });

  window.toggleSidebar = () => { document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('sidebar-overlay').classList.toggle('active'); };
  window.closeSidebar  = () => { document.getElementById('sidebar').classList.add('-translate-x-full'); document.getElementById('sidebar-overlay').classList.remove('active'); };
</script>
</body>
</html>
